site_name: Quant Platform
site_description: Institutional-style quantitative research and backtesting platform
theme:
  name: material
  palette:
    scheme: slate
    primary: blue grey
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - tables
  - admonitions
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Strategies: strategies.md
  - Parameters: parameters.md
  - Portfolio Optimization: portfolio.md
  - API Reference: api-reference.md
