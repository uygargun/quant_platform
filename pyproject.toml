[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Institutional-grade quantitative research platform: market data + backtesting"
requires-python = ">=3.11"
dependencies = [
    # --- Core ---
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "polars>=1.0,<2",
    "pyarrow>=17.0,<19",

    # --- Configuration & validation ---
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",

    # --- Logging ---
    "structlog>=24.0,<26",

    # --- Data layer ---
    "duckdb>=1.0,<2",
    "httpx>=0.27,<1",
    "certifi>=2024.0",

    # --- Backtesting ---
    "numba>=0.60,<1",
    "optuna>=4.0,<5",
    "scipy>=1.13,<2",

    # --- Visualization ---
    "matplotlib>=3.8,<4",
    "plotly>=5.18,<8",
    "streamlit>=1.30,<2",

    # --- API ---
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.10",
]
research = [
    "jupyter>=1.0",
    "yfinance>=1.2",
]
docs = [
    "mkdocs-material>=9.0",
]

[project.scripts]
# Unified entry point
qp = "cli:main"
# Backward-compatible aliases
backtest = "main:main"
# Data layer (standalone access)
qp-download = "data.ingestion.cli:main"
qp-import-histdata = "data.bootstrap.import_histdata:main"
qp-import-csv = "data.bootstrap.import_csv:main"
qp-lake-summary = "data.query.lake_summary:main"
qp-gap-report = "data.query.gap_report:main"
qp-lake-audit = "data.query.lake_audit:main"
qp-catalog = "data.catalog.cli:catalog_summary"
qp-lineage = "data.catalog.cli:lineage"
qp-snapshots = "data.catalog.cli:snapshots"
qp-validate-catalog = "data.catalog.cli:validate_catalog"
qp-bulk-import = "data.bootstrap.bulk:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

# --- Ruff ---
[tool.ruff]
target-version = "py311"
line-length = 99
exclude = [".venv", "__pycache__", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E402",   # module-level import not at top (used intentionally for lazy imports)
    "E741",   # ambiguous variable name (l is clear in math/finance context)
    "E702",   # multiple statements on one line (used in compact numba code)
    "SIM102", # nested if (sometimes clearer than combined condition)
    "SIM105", # contextlib.suppress (try/except/pass is fine)
    "SIM108", # ternary operator (if/else blocks are clearer for multi-line)
    "UP042",  # StrEnum (keep str+Enum for Python 3.10 compat)
    "B905",   # zip strict (not needed for same-length internal arrays)
    "B007",   # unused loop variable (intentional in some iteration patterns)
    "B011",   # assert False (used in tests)
    "SIM118", # key in dict vs dict.keys()
]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
timeout = 120
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services or real databases",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "data/downloads/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "\\.venv/", "data/downloads/"]
